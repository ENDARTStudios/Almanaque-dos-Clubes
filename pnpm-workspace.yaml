packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

# Segurança (dependabot 10-18): mínimos fixados de transitivas vulneráveis.
overrides:
  '@fastify/busboy': '>=3.2.2'
  fast-jwt: '>=6.3.4'
  ip-address: '>=10.7.1'
  deepmerge-ts: '>=8.0.0'
  source-map-js: '>=1.2.2'
  'brace-expansion@^1': '1.1.21'
# braces >=3.0.4 (GHSA-vfj7) ainda NÃO existe no registry (max 3.0.3) — residual
# dev-only (cadeia eslint-config-next→fast-glob), não vai ao bundle; revisitar quando publicado.
