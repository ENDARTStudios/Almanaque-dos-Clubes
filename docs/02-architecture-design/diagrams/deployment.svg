  <text x="356" y="160" font-size="11" fill="#7F1D1D">apps/api/dist · entrypoint.sh</text>
  <text x="356" y="176" font-size="11" fill="#7F1D1D">migrate deploy fail-fast no boot</text>
  <text x="356" y="192" font-size="11" fill="#7F1D1D">scripts/ ETL executáveis (T430)</text>
  <text x="356" y="208" font-size="11" fill="#7F1D1D">api.almanaquedosclubes.com</text>
  <rect x="344" y="234" width="160" height="104" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="356" y="258" font-size="13" font-weight="700" fill="#7F1D1D">Postgres 16</text>
  <text x="356" y="276" font-size="11" fill="#7F1D1D">RLS + role app_user</text>
