  <rect x="724" y="358" width="202" height="86" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="736" y="382" font-size="12" font-weight="700" fill="#7F1D1D">GitHub + S3</text>
  <text x="736" y="400" font-size="11" fill="#7F1D1D">repo · CI · gitleaks</text>
  <text x="736" y="416" font-size="11" fill="#7F1D1D">backups · observabilidade</text>
  <text x="736" y="432" font-size="11" fill="#7F1D1D">Dependabot (triagem)</text>

  <!-- FLOWS -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#DC2626" stroke-width="1.5"/>
