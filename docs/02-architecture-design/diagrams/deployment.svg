  <text x="356" y="308" font-size="11" fill="#7F1D1D">3.857 clubes (T429)</text>
  <text x="356" y="324" font-size="11" fill="#7F1D1D">migrations versionadas</text>
  <rect x="516" y="234" width="160" height="104" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
