  <rect x="344" y="350" width="332" height="94" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="356" y="374" font-size="13" font-weight="700" fill="#7F1D1D">worker + cron</text>
  <text x="356" y="392" font-size="11" fill="#7F1D1D">ETL Wikidata (SPARQL + P625)</text>
  <text x="356" y="408" font-size="11" fill="#7F1D1D">dedup por QID · fila anti-órfão</text>
  <text x="356" y="424" font-size="11" fill="#7F1D1D">backup → S3 · Prometheus</text>

  <!-- ZONE: EXTERNO -->
