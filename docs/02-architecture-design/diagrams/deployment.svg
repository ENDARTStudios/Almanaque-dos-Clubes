<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="dep-title dep-desc" font-family="'Barlow', 'Segoe UI', Arial, sans-serif">
  <title id="dep-title">Almanaque dos Clubes — arquitetura de deployment</title>
  <desc id="dep-desc">Três zonas: Vercel (web Next.js e CI GitHub Actions), Railway (API Fastify com entrypoint migrate deploy, Postgres com RLS, Redis BullMQ) e serviços externos (tiles OSM, Wikidata, Stripe, backups S3). Setas rotuladas mostram os fluxos entre elas.</desc>

  <rect x="0" y="0" width="960" height="600" fill="#FEF2F2"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#7F1D1D">Almanaque dos Clubes — deployment (produção)</text>
  <text x="30" y="58" font-size="12" fill="#7F1D1D" opacity="0.65">verificado contra Dockerfile, railway.json, ci.yml e compose em 2026-09-09 · T430</text>

  <!-- ZONE: VERCEL -->
  <rect x="20" y="78" width="290" height="380" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="34" y="104" font-size="13" font-weight="700" fill="#DC2626">VERCEL</text>
  <rect x="34" y="118" width="262" height="86" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="46" y="142" font-size="13" font-weight="700" fill="#7F1D1D">web — Next.js 16</text>
  <text x="46" y="160" font-size="11" fill="#7F1D1D">apps/web · SSR + Leaflet</text>
  <text x="46" y="176" font-size="11" fill="#7F1D1D">almanaquedosclubes.com</text>
  <text x="46" y="192" font-size="11" fill="#7F1D1D">CSP + remotePatterns fechados</text>
  <rect x="34" y="216" width="262" height="86" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="46" y="240" font-size="13" font-weight="700" fill="#7F1D1D">CI — GitHub Actions</text>
  <text x="46" y="258" font-size="11" fill="#7F1D1D">security-gate · migration-drift</text>
  <text x="46" y="274" font-size="11" fill="#7F1D1D">gitleaks · dependency-audit</text>
  <text x="46" y="290" font-size="11" fill="#7F1D1D">deploy frontend (main)</text>
  <rect x="34" y="380" width="262" height="64" rx="8" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="46" y="404" font-size="13" font-weight="700" fill="#7F1D1D">visitante</text>
  <text x="46" y="422" font-size="11" fill="#7F1D1D">browser → HTTPS (HSTS)</text>
  <text x="46" y="438" font-size="11" fill="#7F1D1D">PT/EN/ES · LGPD banner</text>

  <!-- ZONE: RAILWAY -->
  <rect x="330" y="78" width="360" height="380" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="344" y="104" font-size="13" font-weight="700" fill="#DC2626">RAILWAY</text>
  <rect x="344" y="118" width="332" height="104" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
