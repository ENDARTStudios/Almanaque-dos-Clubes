  <text x="30" y="490" font-size="11" fill="#7F1D1D" opacity="0.7">Fluxos sólidos = runtime (usuário, API, deploy). Tracejados = ETL e backup (jobs).</text>
  <text x="30" y="508" font-size="11" fill="#7F1D1D" opacity="0.7">Fontes: Dockerfile, railway.json, .github/workflows/ci.yml, docker-compose.yml, apps/web/next.config.ts.</text>
  <text x="30" y="560" font-size="11" fill="#7F1D1D" opacity="0.7">Ver também: ARCHITECTURE-CATALOG.md (módulos), DATA-INGESTION.md §15 (ETL), DECISOES.md (D-2026-09-09-t430).</text>
