  <text x="280" y="316" font-size="10" fill="#7F1D1D">deploy</text>
  <line x1="504" y1="286" x2="524" y2="286" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="676" y1="170" x2="706" y2="170" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr)"/>
