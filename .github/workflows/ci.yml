name: CI - Security Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/almanaque'
  NODE_ENV: test

permissions:
  contents: read
  pull-requests: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        # T423 — PostGIS: `prisma db push` cria a coluna `location geometry(Point,4326)`,
        # que exige o tipo `geometry` (extensão postgis) presente ANTES do push.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: almanaque
          POSTGRES_PASSWORD: almanaque_dev_2025
          POSTGRES_DB: almanaque
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U almanaque -d almanaque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (PostgreSQL)
        run: cd apps/api && npx prisma generate --schema=prisma/schema.prisma

      - name: Create PostGIS extension (test DB)
        # O tipo `geometry` precisa existir antes de `prisma db push` criar/alterar
        # a coluna `location` (T423). A imagem do service container é postgis/postgis.
        run: cd apps/api && npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/create_postgis.sql

      - name: Sync schema (test DB)
        run: cd apps/api && npx prisma db push --schema=prisma/schema.prisma
      - name: Apply RLS + app_user (test DB)
        run: |
          cd apps/api
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_sessions_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_favorites_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_legal_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/create_app_user.sql
          # rls_users por ÚLTIMO: o GRANT EXECUTE da função pre-auth exige a role
          # app_user (criada no passo anterior).
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_users_setup.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build @almanaque/domain
        run: pnpm --filter @almanaque/domain build

      - name: Unit & Integration Tests
        run: pnpm test:unit --coverage
        env:
          # Sobrescreve env do workflow para apontar ao service container
          DATABASE_URL: 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/almanaque'
          # R1 (D-2026-09-18-testes-sem-skip-silencioso): em CI, banco ausente é
          # FALHA — o guard dbOk dos testes lança em vez de pular silenciosamente.
          TEST_REQUIRE_DB: 'true'

      - name: Check audit
        run: pnpm audit --audit-level=high || true

  deploy-vercel-frontend:
    needs: [security-gate]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }

      - name: Entrypoint image-path guard (T435)
        # Sem Docker e sem rede: garante que todo caminho usado em
        # apps/api/entrypoint.sh existe na imagem descrita pelo Dockerfile.
        # Teria barrado o incidente 2026-09-14 (prisma path fora da imagem).
        run: node scripts/ci/check-entrypoint.mjs

      - run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --project almanaque-dos-clubes --token=${{ secrets.VERCEL_TOKEN }} --yes

  migration-drift:
    # T430 — detecta a classe P2022 (coluna no schema.prisma sem migration que
    # a crie). Procedimento = espelho do upgrade real de produção: baseline dump
    # + resolve pinado + deploy; o diff final compara esse estado contra o schema.
    # RLS/fulltext/extensions vivem fora de migrations/ por design e são
    # invisíveis ao datamodel diff — sem falso-positivo estrutural.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: almanaque
          POSTGRES_PASSWORD: almanaque_dev_2025
          POSTGRES_DB: almanaque
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U almanaque -d almanaque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRIFT_URL: 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/driftcheck'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Provision scratch DB from prod baseline dump
        run: |
          psql 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/almanaque' -c 'CREATE DATABASE driftcheck'
          psql "$DRIFT_URL" -f apps/api/prisma/baseline/prod-structure-2026-09-09.sql

      - name: Mark historically hand-resolved migrations as applied (pinned mirror of prod _prisma_migrations)
        # Lista PINADA = espelho exato do histórico de produção. NÃO acrescentar
        # novas migrations aqui: o deploy abaixo aplica as pendentes.
        run: |
          cd apps/api
          export DATABASE_URL="$DRIFT_URL"
          for m in 20260716154544_init 20260720000001_phase2_final 20260720202741_init_almanaque_v2 20260720202940_add_composite_indexes 20260814_add_qid_and_stadium 20260823_trial_used_at 20260824_rls_sessions 20260825_rls_sessions_complete; do
            npx prisma migrate resolve --applied "$m" --schema=prisma/schema.prisma
          done

      - name: Deploy pending (exactly what the prod entrypoint runs)
        run: |
          cd apps/api
          DATABASE_URL="$DRIFT_URL" npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Fail if schema drifted from baseline+migrations (P2022 class)
        # Exceção conhecida e documentada (T430): `stadiums_location_gix` é um
        # índice GIST criado pela migration em bancos COM PostGIS, mas o Prisma
        # não expressa índice espacial no schema (campo Unsupported) — filtrado
        # aqui; qualquer outra linha de DDL real falha o job.
        run: |
          cd apps/api
          npx prisma migrate diff --from-url "$DRIFT_URL" --to-schema-datamodel prisma/schema.prisma --script > /tmp/drift.sql || true
          grep -v -e '^-- DropIndex$' -e '^DROP INDEX "stadiums_location_gix";$' /tmp/drift.sql | grep -v -e '^$' -e '^--' > /tmp/drift-real.sql || true
          if [ -s /tmp/drift-real.sql ]; then echo "SCHEMA DRIFT DETECTED:"; cat /tmp/drift-real.sql; exit 1; fi
          echo "No schema drift."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - name: Audit de dependências
        continue-on-error: true
        run: pnpm audit --audit-level=high
