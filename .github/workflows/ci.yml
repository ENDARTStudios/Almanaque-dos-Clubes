name: CI - Security Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/almanaque'
  NODE_ENV: test

permissions:
  contents: read
  pull-requests: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        # T423 — PostGIS: `prisma db push` cria a coluna `location geometry(Point,4326)`,
        # que exige o tipo `geometry` (extensão postgis) presente ANTES do push.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: almanaque
          POSTGRES_PASSWORD: almanaque_dev_2025
          POSTGRES_DB: almanaque
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U almanaque -d almanaque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (PostgreSQL)
        run: cd apps/api && npx prisma generate --schema=prisma/schema.prisma

      - name: Create PostGIS extension (test DB)
        # O tipo `geometry` precisa existir antes de `prisma db push` criar/alterar
        # a coluna `location` (T423). A imagem do service container é postgis/postgis.
        run: cd apps/api && npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/create_postgis.sql

      - name: Sync schema (test DB)
        run: cd apps/api && npx prisma db push --schema=prisma/schema.prisma
      - name: Apply RLS + app_user (test DB)
        run: |
          cd apps/api
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_sessions_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_favorites_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_legal_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_notifications_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_club_ownership_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_club_description_proposals_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_reports_setup.sql
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/create_app_user.sql
          # rls_users por ÚLTIMO: o GRANT EXECUTE da função pre-auth exige a role
          # app_user (criada no passo anterior).
          npx prisma db execute --schema=prisma/schema.prisma --file scripts/sql/rls_users_setup.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # O script `lint` da RAIZ varre apenas `apps/api`, `apps/worker` e `packages/**` — o
      # `apps/web` NUNCA era lintado em pipeline nenhum. Quando ligamos, o linter nem executava
      # (o `eslint-plugin-react` declara peer até `^9.7` e chama `context.getFilename()`,
      # removido no ESLint 10, que o dependabot tinha instalado): TODA regra do plugin React
      # morria, em silêncio, porque ninguém rodava. Com o ESLint fixado em 9, 39 problemas
      # acumulados apareceram. Este passo é o que impede que voltem a se acumular.
      - name: Lint (apps/web)
        working-directory: apps/web
        run: pnpm exec eslint .

      # T581 — audita os arquivos que um agente LÊ e OBEDECE (skills, agentes, AGENTS.md) e detecta
      # divergência entre a fonte canônica (`plugins/`) e as cópias (`.dsh/`, `.zcode/`).
      #
      # POR QUE ESTE PASSO EXISTE, com o achado que o motivou: a skill `release-loop` mandava
      # `git commit --no-verify` porque o hook pre-commit estava quebrado. O bug foi corrigido
      # (eslint fixado em 9), mas a instrução ficou — e continuou sendo obedecida, pulando a
      # verificação que funciona. Numa sessão, 8 commits saíram com --no-verify por causa dela.
      # Nenhum gate olhava para isso, porque instrução de agente não é código nem doc.
      #
      # O segundo achado: duas skills apontavam para `docs/ACCESSIBILITY.md` e
      # `docs/HERO-NUMEROS.md`, movidos para `docs/07-operations-marketing/` na reorganização de
      # docs (7cb0a52). A instrução mandava ler caminho que não existe mais.
      #
      # As cópias em `.dsh/` e `.zcode/` são o que o agente realmente lê. Se a fonte é corrigida e
      # as cópias não, a correção não chega a ninguém — é por isso que o --check entra no CI.
      - name: Agentes (drift de skills e instruções)
        run: pnpm agents:check

      # T560 — `next build` do apps/web. Faltava, e a ausência tem consequência medida.
      #
      # O QUE ESTE PASSO PEGA E OS OUTROS NÃO
      #   Typecheck, lint e testes passam por ARQUIVO. Nenhum deles pergunta se os módulos que as
      #   rotas importam EXISTEM e resolvem. Um import para arquivo inexistente, um erro de
      #   fronteira server/client, um `use client` faltando: nada disso aparece antes do build.
      #
      #   Foi exatamente o buraco que me fez abrir um PR de "correção urgente" para um defeito que
      #   não existia (o arquivo estava lá; minha checagem é que deu falso negativo). Se o
      #   pipeline compilasse o app, eu teria a resposta em segundos em vez de investigar por
      #   minutos — e, mais importante, um import quebrado de verdade não entraria verde.
      #
      # Sem segredos: o build do Next não precisa de banco. As variáveis públicas caem no
      # fallback de `lib/api-base.ts`, que é o mesmo caminho de um build sem configuração.
      - name: Build (apps/web)
        working-directory: apps/web
        run: pnpm build

      - name: Build @almanaque/domain
        run: pnpm --filter @almanaque/domain build

      - name: Unit & Integration Tests
        run: pnpm test:unit --coverage
        env:
          # Sobrescreve env do workflow para apontar ao service container
          DATABASE_URL: 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/almanaque'
          # R1 (D-2026-09-18-testes-sem-skip-silencioso): em CI, banco ausente é
          # FALHA — o guard dbOk dos testes lança em vez de pular silenciosamente.
          TEST_REQUIRE_DB: 'true'

      - name: Check audit
        run: pnpm audit --audit-level=high || true

      - name: Entrypoint image-path guard (T435)
        # Movido do antigo job de deploy (WS-G-1.3): valida que todo caminho usado em
        # apps/api/entrypoint.sh existe na imagem (sem Docker/rede). Roda no CI.
        run: node scripts/ci/check-entrypoint.mjs

  # WS-G-1.3 — Deploy web SEPARADO do CI, com filtro de paths (deploy-web.yml).
  # Motivo: sem filtro, QUALQUER push em main (inclui API-only/docs-only) disparava
  # `vercel deploy --prod`, queimando `api-deployments-free-per-day` sem necessidade.
  # O CI (security-gate/migration-drift) continua rodando em todo push/PR.

  migration-drift:
    # T430 — detecta a classe P2022 (coluna no schema.prisma sem migration que
    # a crie). Procedimento = espelho do upgrade real de produção: baseline dump
    # + resolve pinado + deploy; o diff final compara esse estado contra o schema.
    # RLS/fulltext/extensions vivem fora de migrations/ por design e são
    # invisíveis ao datamodel diff — sem falso-positivo estrutural.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: almanaque
          POSTGRES_PASSWORD: almanaque_dev_2025
          POSTGRES_DB: almanaque
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U almanaque -d almanaque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRIFT_URL: 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/driftcheck'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Provision scratch DB from prod baseline dump
        run: |
          psql 'postgresql://almanaque:almanaque_dev_2025@localhost:5432/almanaque' -c 'CREATE DATABASE driftcheck'
          psql "$DRIFT_URL" -f apps/api/prisma/baseline/prod-structure-2026-09-09.sql

      - name: Mark historically hand-resolved migrations as applied (pinned mirror of prod _prisma_migrations)
        # Lista PINADA = espelho exato do histórico de produção. NÃO acrescentar
        # novas migrations aqui: o deploy abaixo aplica as pendentes.
        run: |
          cd apps/api
          export DATABASE_URL="$DRIFT_URL"
          for m in 20260716154544_init 20260720000001_phase2_final 20260720202741_init_almanaque_v2 20260720202940_add_composite_indexes 20260814_add_qid_and_stadium 20260823_trial_used_at 20260824_rls_sessions 20260825_rls_sessions_complete; do
            npx prisma migrate resolve --applied "$m" --schema=prisma/schema.prisma
          done

      - name: Deploy pending (exactly what the prod entrypoint runs)
        run: |
          cd apps/api
          DATABASE_URL="$DRIFT_URL" npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Fail if schema drifted from baseline+migrations (P2022 class)
        # Exceção conhecida e documentada (T430): `stadiums_location_gix` é um
        # índice GIST criado pela migration em bancos COM PostGIS, mas o Prisma
        # não expressa índice espacial no schema (campo Unsupported) — filtrado
        # aqui; qualquer outra linha de DDL real falha o job.
        run: |
          cd apps/api
          npx prisma migrate diff --from-url "$DRIFT_URL" --to-schema-datamodel prisma/schema.prisma --script > /tmp/drift.sql || true
          grep -v -e '^-- DropIndex$' -e '^DROP INDEX "stadiums_location_gix";$' /tmp/drift.sql | grep -v -e '^$' -e '^--' > /tmp/drift-real.sql || true
          if [ -s /tmp/drift-real.sql ]; then echo "SCHEMA DRIFT DETECTED:"; cat /tmp/drift-real.sql; exit 1; fi
          echo "No schema drift."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Audit de dependências
        continue-on-error: true
        run: pnpm audit --audit-level=high
