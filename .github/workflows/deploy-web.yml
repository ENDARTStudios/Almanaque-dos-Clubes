name: Deploy Web (Vercel)

# WS-G-1.3 — Deploy de produção do WEB, SEPARADO do CI e com filtro de paths.
#
# Antes: `deploy-vercel-frontend` vivia no ci.yml e rodava em QUALQUER push em main
# (inclui mudanças apenas em apps/api/**, docs/**, orquestração), disparando
# `vercel deploy --prod` sem necessidade e queimando `api-deployments-free-per-day`
# (bloqueou o WS-C-2 por ~24h). O CI (security-gate/migration-drift) continua no ci.yml.
#
# T586 — ESTADO ATUAL, que supersede o plano pendente que estava aqui.
#
# O QUE FOI MEDIDO ANTES DE AGIR (7 dias deste repositorio):
#   165 commits no `main`, dos quais 104 (63%) nao tocavam `apps/web` — e cada um custava um
#   build; 96 branches com push (de 282 no total), 37 delas sem mudanca relevante; e, na janela
#   de 45 min analisada, 18 de 20 deploys eram PREVIEW. Preview era ~90% do consumo.
#
# O QUE MUDOU: a integracao nativa da Vercel esta DESLIGADA inteira —
#   apps/web/vercel.json -> "git": { "deploymentEnabled": false }
# O schema oficial (openapi.vercel.sh/vercel.json) diz: "any non specified branch is `true` by
# default", e o campo aceita booleano. `false` desliga todos os branches.
#
# POR QUE ISSO NAO PARA A PRODUCAO: quem publica producao e ESTE workflow, um deploy por CLI
# (`vercel deploy --prod`), e nao um "auto-deployment on commit". O filtro de paths acima
# continua valendo — so roda quando algo do app muda.
#
# `ignoreCommand` (apps/web/scripts/ignore-build.mjs) fica ligado como GUARDA: se as previews
# forem reativadas, branch que nao toca o app nem as dependencias compartilhadas nao construi.
# Enquanto a integracao estiver desligada, ele nao e acionado e nao custa nada.
#
# REVERTER AS PREVIEWS: trocar `false` por `{ "main": false }` no vercel.json. Com a guarda
# ligada, isso devolve preview apenas para branches que realmente mexem no app.
#
# Dispara APENAS quando algo que afeta o build do web muda. Reversível: para voltar ao
# comportamento antigo, reintroduza o job no ci.yml.

#
# Dispara APENAS quando algo que afeta o build do web muda. Reversível: para voltar ao
# comportamento antigo, reintroduza o job no ci.yml.
#
# LIMITAÇÃO DECLARADA: isto neutraliza o deploy via GitHub Actions. Se a integração
# NATIVA da Vercel auto-deployar produção em push para `main`, é preciso configurar
# "Ignored Build Step"/"Ignored Paths" no projeto (Operador) — ou desativar a nativa.
#
# ── CUSTO DE BUILD (incidente de 04/11/2026) ─────────────────────────────────────────────
# O projeto PRO estourou o limite de gastos em **Build CPU Minutes**. A causa era o modelo:
# `vercel deploy --prod` enviava o código e o BUILD rodava NA VERCEL (next build + install),
# consumindo CPU do plano a cada deploy de produção.
#
# ALTERNATIVA ADOTADA: construir no RUNNER DO GITHUB e publicar o artefato pronto
# (`vercel build` + `vercel deploy --prebuilt`). O build deixa de consumir Build CPU Minutes
# da Vercel; o GitHub Actions ganha ~1 min de job e o deploy sobe o `.vercel/output` já pronto.
# Teste local do `vercel build --prod`: 51 s até "Build Completed".
#
# Se o custo de SERVING da Vercel ainda for um problema, o próximo passo é migrar o web para
# um host de container (Railway, que já hospeda a API) — a alternativa está documentada em
# docs/DEPLOY-WEB-CUSTOS.md. Este workflow continua sendo a opção de menor mudança.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'apps/web/package.json'
      - 'apps/web/vercel.json'
      - 'tsconfig*.json'
      - 'apps/web/tsconfig*.json'
      - 'apps/web/next.config.*'
      - 'apps/web/postcss.config.*'
      - 'apps/web/tailwind.config.*'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_TELEMETRY_DISABLED: '1'
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      # O token lido de VERCEL_TOKEN (job env) evita token em linha de comando.
      - name: Link do projeto Vercel
        run: npx --yes vercel@57 link --yes --project almanaque-dos-clubes --scope end-art-studios

      - name: Pull do ambiente de produção
        run: npx --yes vercel@57 pull --yes --environment=production

      # IMPORTANTE: os comandos rodam na RAIZ do repositório. O projeto Vercel tem
      # Root Directory = apps/web; rodar o CLI de dentro de apps/web faz ele anexar
      # "apps/web" de novo ao caminho e falhar (verificado em 04/11/2026).
      - name: Build do artefato (prebuilt)
        run: npx --yes vercel@57 build --prod

      - name: Deploy do artefato prebuilt
        run: npx --yes vercel@57 deploy --prebuilt --prod --yes
