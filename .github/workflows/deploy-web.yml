name: Deploy Web (Vercel)

# WS-G-1.3 — Deploy de produção do WEB, SEPARADO do CI e com filtro de paths.
#
# Antes: `deploy-vercel-frontend` vivia no ci.yml e rodava em QUALQUER push em main
# (inclui mudanças apenas em apps/api/**, docs/**, orquestração), disparando
# `vercel deploy --prod` sem necessidade e queimando `api-deployments-free-per-day`
# (bloqueou o WS-C-2 por ~24h). O CI (security-gate/migration-drift) continua no ci.yml.
#
# PENDENTE (janela segura, ainda NAO aplicado): a integracao NATIVA da Vercel segue
# ativa e auto-deploya producao no `main` a cada push (docs-only inclusive -- foi o que
# estourou `api-deployments-free-per-day`). O filtro de paths acima so controla ESTE
# workflow; nao impede a nativa. Plano escolhido (Opcao 2, reversivel):
#   apps/web/vercel.json -> "git": { "deploymentEnabled": { "main": false } }
# Efeito: desliga a producao automatica nativa no `main`, MANTEM previews de PR, e a
# producao passa a ser unicamente este workflow. Reverter = remover o bloco "git".
# Aplicar so apos a janela de cota, com smoke de release web real.
#
# Dispara APENAS quando algo que afeta o build do web muda. Reversível: para voltar ao
# comportamento antigo, reintroduza o job no ci.yml.
#
# LIMITAÇÃO DECLARADA: isto neutraliza o deploy via GitHub Actions. Se a integração
# NATIVA da Vercel auto-deployar produção em push para `main`, é preciso configurar
# "Ignored Build Step"/"Ignored Paths" no projeto (Operador) — ou desativar a nativa.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'apps/web/package.json'
      - 'apps/web/vercel.json'
      - 'tsconfig*.json'
      - 'apps/web/tsconfig*.json'
      - 'apps/web/next.config.*'
      - 'apps/web/postcss.config.*'
      - 'apps/web/tailwind.config.*'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel (production)
        # Token via env (não em flag de linha de comando). O `vercel` lê VERCEL_TOKEN.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --project almanaque-dos-clubes --yes
